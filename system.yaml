# yaml-language-server: $schema=./system.schema.json
student: hrahal.ieu2024
prefix: hrahal-ieu2024
# The UI is a Storage static website in the same region as everything else (ADR-8).
public_url: https://hrahalieu2024ui.z1.web.core.windows.net
ui:
  path: ui
  storage_account: hrahalieu2024ui
  calls: [workouts, records]
azure:
  resource_group: rg-sdd-3a
  container_apps_environment: hrahal-ieu2024-env
  sql_server: hrahal-ieu2024-sql
  registry: ghcr.io/habo212
services:
  workouts:
    description: Workouts (date, notes) with their exercises and sets; owns the workouts database.
    path: services/workouts
    openapi: services/workouts/openapi.yaml
    port_default: 8000
    health: /health
    migrations: services/workouts/migrations
    env:
      PORT: { default: 8000, description: Port the service listens on }
      DATABASE_URL: { secret: true, description: "Connection string of the workouts database (mssql://user:password@host:1433/db)" }
      GIT_SHA: { default: dev, description: "Commit the image was built from, reported by /health; set by CD" }
      UI_ORIGIN: { default: "http://localhost:8080", description: The only browser origin allowed by CORS }
    calls: []
    azure:
      container_app: hrahal-ieu2024-workouts
      sql_database: hrahal-ieu2024-workouts-db
  records:
    description: Personal records, estimated 1RM progress and goals per exercise; owns the goals database.
    path: services/records
    openapi: services/records/openapi.yaml
    port_default: 8000
    health: /health
    migrations: services/records/migrations
    env:
      PORT: { default: 8000, description: Port the service listens on }
      DATABASE_URL: { secret: true, description: "Connection string of the records database (mssql://user:password@host:1433/db)" }
      GIT_SHA: { default: dev, description: "Commit the image was built from, reported by /health; set by CD" }
      UI_ORIGIN: { default: "http://localhost:8080", description: The only browser origin allowed by CORS }
      WORKOUTS_URL: { default: "http://workouts:8000", description: Base URL of the workouts service }
      WORKOUTS_TIMEOUT_S: { default: 2, description: "Timeout in seconds for calls to workouts (5 on Azure, set by CD)" }
    calls:
      - service: workouts
        url_env: WORKOUTS_URL
        endpoints: ["GET /api/workouts/exercises/{name}/sets"]
        timeout_s: 2
        on_failure: >-
          The records view returns 503 with a clear "workouts service is unavailable" error, the
          exercise name and the goal records owns; records' own /health stays 200.
    azure:
      container_app: hrahal-ieu2024-records
      sql_database: hrahal-ieu2024-records-db
