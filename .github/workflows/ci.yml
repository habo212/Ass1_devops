name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [workouts, records]
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: LocalDev_Only1!
        ports:
          - 1433:1433
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    env:
      TEST_SQLSERVER_URL: mssql://sa:LocalDev_Only1!@localhost:1433/master
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - name: Wait for SQL Server
        run: |
          for i in $(seq 1 30); do
            python -c "import pymssql; pymssql.connect(server='localhost', user='sa', password='LocalDev_Only1!')" && exit 0
            sleep 2
          done
          exit 1
      - name: Tests with coverage gate
        run: pytest --cov=${{ matrix.service }} --cov-report=term-missing --cov-fail-under=70

  build:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        service: [workouts, records]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ${{ matrix.service }}:ci services/${{ matrix.service }}
